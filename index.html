<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090f0d">
  <meta name="description" content="Resistance Band Workouts - sức mạnh, bộc phát, cân bằng và theo dõi tiến bộ cá nhân.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BandFit">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>BandFit · Resistance Band Workouts</title>
</head>
<body>
  <div id="shell">
    <header class="topbar">
      <button id="brandBtn" class="brand" aria-label="Về trang chủ">
        <span class="brand-icon" aria-hidden="true">↗</span>
        <span class="brand-word">BAND<span>FIT</span><small>RESISTANCE TRAINING</small></span>
      </button>
      <div class="top-actions">
        <span class="online-dot" id="onlineStatus" title="Sẵn sàng tập offline"></span>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Cài đặt" title="Cài đặt">⚙</button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Điều hướng">
      <button class="nav-item active" data-page="home" type="button"><span class="nav-symbol">▦</span><span>Tổng quan</span></button>
      <button class="nav-item" data-page="library" type="button"><span class="nav-symbol">◈</span><span>Bài tập</span></button>
      <button class="nav-item" data-page="history" type="button"><span class="nav-symbol">▥</span><span>Lịch sử</span></button>
    </nav>
  </div>
  <dialog id="settingsDialog" class="sheet-dialog" aria-labelledby="settingsTitle">
    <div class="sheet-head"><div><div class="eyebrow">PERSONALIZE</div><h2 id="settingsTitle">Cài đặt buổi tập</h2></div><button class="icon-btn close-dialog" data-dialog="settingsDialog" aria-label="Đóng">✕</button></div>
    <form id="settingsForm" class="settings-body" method="dialog">
      <label>Thời gian nghỉ giữa các hiệp <span class="input-unit">giây</span><input name="restSec" type="number" min="15" max="300" step="5" required></label>
      <label>Đếm giờ một hiệp thường <span class="input-unit">giây</span><input name="workSec" type="number" min="15" max="180" step="5" required></label>
      <p class="muted tiny">Bài giữ tư thế dùng thời gian riêng; bài bộc phát sử dụng hiệp ngắn để đảm bảo tốc độ. Có thể kết thúc hiệp sớm.</p>
      <label class="check-setting"><span>Âm báo kết thúc giờ</span><input name="sound" type="checkbox"></label>
      <label class="check-setting"><span>Rung khi kết thúc (thiết bị hỗ trợ)</span><input name="vibration" type="checkbox"></label>
      <button class="primary-btn wide" type="submit">Lưu cài đặt</button>
    </form>
  </dialog>
  <dialog id="swapDialog" class="sheet-dialog" aria-labelledby="swapTitle">
    <div class="sheet-head"><div><div class="eyebrow">SWAP EXERCISE</div><h2 id="swapTitle">Đổi bài tương đương</h2></div><button class="icon-btn close-dialog" data-dialog="swapDialog" aria-label="Đóng">✕</button></div>
    <div id="swapList" class="sheet-scroll"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
